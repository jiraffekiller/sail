name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
      - name: Build app bundle
        run: make bundle
      - name: Smoke test (status mode)
        run: build/Sail.app/Contents/MacOS/Sail --status || true
