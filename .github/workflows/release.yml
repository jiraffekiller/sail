name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build app bundle
        run: make bundle
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Disk image
        run: |
          make dmg
          mv build/Sail-v*.dmg "build/Sail-${GITHUB_REF_NAME}.dmg"
      - name: Zip and checksums
        run: |
          cd build
          ditto -c -k --keepParent Sail.app "Sail-${GITHUB_REF_NAME}.zip"
          shasum -a 256 "Sail-${GITHUB_REF_NAME}.zip" > "Sail-${GITHUB_REF_NAME}.zip.sha256"
          shasum -a 256 "Sail-${GITHUB_REF_NAME}.dmg" > "Sail-${GITHUB_REF_NAME}.dmg.sha256"
      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/Sail-${{ github.ref_name }}.dmg
            build/Sail-${{ github.ref_name }}.dmg.sha256
            build/Sail-${{ github.ref_name }}.zip
            build/Sail-${{ github.ref_name }}.zip.sha256
          generate_release_notes: true
